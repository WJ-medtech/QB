<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国試対策アプリ</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<meta property="og:title" content="国試対策アプリ">
<meta property="og:description" content="medu4 × QBの進捗管理">
<meta property="og:type" content="website">

<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --ink:#16232e; --ink-soft:#4a5c6b; --bg:#f5f8fa; --card:#fff; --line:#dbe4ea;
    --teal:#0f8b8d; --teal-soft:#e3f3f2; --amber:#d98e3a; --amber-soft:#faf0e2;
    --done:#2ba58a; --done-soft:#e6f5ef; --purple:#6a5acd; --purple-soft:#ece9fb;
    --coral:#e0665a; --coral-soft:#fbe7e5; --gold:#dcb13f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:80px;}
  button{font-family:inherit;}

  header{background:var(--ink);color:#fff;padding:16px 16px 12px;}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .htitle{font-size:14px;font-weight:700;}
  .hsub{font-size:10px;color:#8fb9ba;font-family:"SF Mono",Menlo,monospace;margin-top:2px;}
  .auth-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;padding:6px 11px;font-size:11px;font-weight:700;white-space:nowrap;}
  .auth-btn.on{background:var(--done-soft);color:var(--done);border-color:var(--done);}
  .cd{display:flex;align-items:baseline;gap:6px;margin-top:10px;}
  .cd .n{font-size:28px;font-weight:800;font-family:"SF Mono",Menlo,monospace;line-height:1;}
  .cd .l{font-size:10.5px;color:#a9bcc6;}

  main{max-width:560px;margin:0 auto;padding:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;}
  .card h2{font-size:12.5px;margin:0 0 9px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .empty{font-size:11.5px;color:var(--ink-soft);padding:8px 2px;}

  .stats{display:flex;gap:8px;margin-bottom:11px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;}
  .stat .k{font-size:9.5px;color:var(--ink-soft);}
  .stat .v{font-size:17px;font-weight:800;font-family:"SF Mono",Menlo,monospace;margin-top:1px;}
  .stat.s1 .v{color:var(--gold);} .stat.s2 .v{color:var(--teal);}

  /* task row (quick log) */
  .trow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #eef2f5;}
  .trow:last-child{border-bottom:none;}
  .tag{font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:5px;flex-shrink:0;}
  .tg-m{background:var(--teal-soft);color:var(--teal);}
  .tg-a{background:var(--purple-soft);color:var(--purple);}
  .tbody{flex:1;min-width:0;}
  .tlabel{font-size:11.5px;font-weight:700;line-height:1.35;}
  .tmeta{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-soft);
    font-family:"SF Mono",Menlo,monospace;margin:4px 0 2px;}
  .tbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .tfill{height:100%;background:linear-gradient(90deg,var(--teal),var(--done));}
  .quick{display:flex;gap:4px;flex-shrink:0;align-items:center;}
  .qbtn{background:var(--done-soft);color:var(--done);border:1px solid var(--done);border-radius:8px;
    padding:7px 9px;font-size:11px;font-weight:800;white-space:nowrap;}
  .qbtn.alt{background:var(--teal-soft);color:var(--teal);border-color:var(--teal);}
  .qnum{width:42px;padding:6px 2px;border:1px solid var(--line);border-radius:7px;font-size:12px;
    text-align:center;font-family:"SF Mono",Menlo,monospace;}

  /* quota card */
  .quota{background:var(--purple-soft);border-radius:11px;padding:11px 13px;margin-bottom:9px;}
  .quota .qt{font-size:11px;color:var(--purple);font-weight:800;margin-bottom:5px;}
  .quota .qv{font-size:14px;font-weight:800;color:var(--ink);}
  .quota .qs{font-size:10px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}

  /* week planner */
  .wk-actions{display:flex;gap:6px;margin-bottom:10px;}
  .week-nav{display:flex;align-items:center;gap:6px;margin-bottom:9px;}
  .week-nav .wk-btn{flex:0 0 auto;padding:7px 10px;font-size:10.5px;}
  .week-nav .wk-label{flex:1;text-align:center;font-size:11.5px;font-weight:700;font-family:"SF Mono",Menlo,monospace;color:var(--ink-soft);}
  .wk-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:11.5px;font-weight:700;}
  .wk-primary{background:var(--teal);color:#fff;}
  .wk-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft);}

  .dayrow{display:flex;gap:8px;margin-bottom:7px;align-items:stretch;}
  .dcell{width:52px;flex-shrink:0;border-radius:10px;background:#fff;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;}
  .dcell.today{background:var(--ink);border-color:var(--ink);}
  .dcell .dn{font-size:12px;font-weight:800;}
  .dcell.today .dn{color:#fff;}
  .dcap{font-size:8.5px;font-family:"SF Mono",Menlo,monospace;color:var(--ink-soft);margin-top:2px;}
  .dcell.today .dcap{color:#8fb9ba;}
  .dcap input{width:30px;border:none;background:transparent;font-size:9px;text-align:center;
    font-family:"SF Mono",Menlo,monospace;color:inherit;padding:0;}
  .dslot{flex:1;background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:6px;
    display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:44px;}
  .dslot.over{border-color:var(--coral);background:var(--coral-soft);}
  .dslot .ph{font-size:10px;color:#c3cdd4;}
  .ac{padding:5px 8px;border-radius:7px;font-size:9.5px;font-weight:700;color:#fff;line-height:1.3;}
  .ac-m{background:var(--teal);} .ac-a{background:var(--purple);}
  .dload{font-size:8.5px;font-family:"SF Mono",Menlo,monospace;margin-top:2px;}
  .dload.over{color:var(--coral);font-weight:700;}

  .tray{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .chip{padding:10px 13px;border-radius:10px;font-size:11.5px;font-weight:700;color:#fff;
    text-align:left;line-height:1.4;border:none;width:100%;}
  .chip.sel{outline:3px solid var(--ink);outline-offset:1px;}
  .ch-m{background:var(--teal);} .ch-a{background:var(--purple);}
  .sel-hint{font-size:11px;color:var(--teal);font-weight:700;margin-bottom:8px;text-align:center;
    background:var(--teal-soft);padding:8px;border-radius:9px;}

  select,.txtin{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
    font-size:12px;background:#fff;color:var(--ink);font-family:inherit;margin-bottom:8px;}

  /* tabs */
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10;}
  .tb{flex:1;padding:9px 3px 11px;text-align:center;font-size:10px;color:var(--ink-soft);background:none;border:none;}
  .tb .ic{display:block;font-size:16px;margin-bottom:2px;}
  .tb.active{color:var(--teal);font-weight:700;}
  .owner{display:none;} body.is-owner .owner{display:block;}
  .view{display:none;} .view.active{display:block;}

  /* plan chart */
  .prow{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid #eef2f5;}
  .prow:last-child{border-bottom:none;}
  .prow.now{background:var(--teal-soft);border-radius:7px;padding-left:6px;padding-right:6px;}
  .pdate{font-size:9px;color:var(--ink-soft);font-family:"SF Mono",Menlo,monospace;width:62px;flex-shrink:0;}
  .pname{font-size:11px;font-weight:700;flex:1;min-width:0;}
  .pbar{width:56px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex-shrink:0;}
  .pfill{height:100%;background:linear-gradient(90deg,var(--teal),var(--done));}
  .ppct{font-size:9px;font-family:"SF Mono",Menlo,monospace;color:var(--ink-soft);width:28px;text-align:right;flex-shrink:0;}
  .tlabel2{font-size:10px;font-weight:700;color:var(--ink-soft);margin:9px 0 3px;}

  /* editor */
  .ed-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid #eef2f5;}
  .ed-row:last-child{border-bottom:none;}
  .ed-label{flex:1;font-size:11px;min-width:0;line-height:1.35;}
  .ed-target{width:56px;padding:5px;border:1px solid var(--line);border-radius:6px;font-size:11px;
    text-align:center;font-family:"SF Mono",Menlo,monospace;}
  .ed-del{background:var(--coral-soft);color:var(--coral);border:none;border-radius:6px;padding:6px 8px;font-size:10px;font-weight:700;}
  .add-box{background:var(--bg);border-radius:10px;padding:10px;margin-top:10px;}
  .add-box .r{display:flex;gap:6px;}
  .add-box .r > *{flex:1;}

  /* login */
  .lo{display:none;position:fixed;inset:0;background:rgba(22,35,46,.55);z-index:60;align-items:center;justify-content:center;padding:20px;}
  .lo.show{display:flex;}
  .locard{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:320px;}
  .lohead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;margin-bottom:12px;}
  .loclose{background:none;border:none;font-size:20px;color:var(--ink-soft);}
  .locard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;margin-bottom:8px;}
  .losub{width:100%;background:var(--ink);color:#fff;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:700;}
  .lomsg{font-size:11px;color:var(--coral);margin-top:8px;min-height:14px;}

  .errbar{display:none;background:var(--coral-soft);color:#8a2f26;padding:10px 13px;font-size:11px;
    line-height:1.6;border-bottom:1px solid var(--coral);word-break:break-all;}
  .errbar.show{display:block;}
  .errbar b{display:block;margin-bottom:3px;}
  .errbar button{margin-top:6px;background:#fff;border:1px solid var(--coral);color:var(--coral);
    border-radius:7px;padding:5px 9px;font-size:10.5px;font-weight:700;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:12.5px;font-weight:700;z-index:70;opacity:0;
    transition:opacity .3s,top .3s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;top:24px;}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="htitle">国試対策アプリ</div>
      <div class="hsub" id="dateHead"></div>
      <div class="hsub" style="opacity:.6;">build 2026-08-24-v8</div>
    </div>
    <button class="auth-btn" id="authBtn">🔑</button>
  </div>
  <div class="cd"><span class="n" id="cdNum">--</span><span class="l">日 · 国試模試(1/18)まで</span></div>
</header>

<div class="errbar" id="errbar"></div>

<div class="lo" id="lo">
  <div class="locard">
    <div class="lohead"><span>ログイン</span><button class="loclose" id="loClose">×</button></div>
    <input type="email" id="loEmail" placeholder="メールアドレス" autocomplete="username">
    <input type="password" id="loPass" placeholder="パスワード" autocomplete="current-password">
    <button class="losub" id="loSub">ログイン</button>
    <div class="lomsg" id="loMsg">一度ログインすれば、この端末では次回から自動でログイン状態になります。</div>
  </div>
</div>

<main>

<!-- ========== TODAY ========== -->
<div class="view" id="view-today">
  <div class="stats">
    <div class="stat s1"><div class="k">連続日数</div><div class="v" id="stStreak">🔥0</div></div>
    <div class="stat s2"><div class="k">昨日やった量</div><div class="v" id="stYest">-</div></div>
  </div>
  <div class="card">
    <h2>📕 今日の暗記ノルマ（自動）</h2>
    <div id="quotaArea"></div>
  </div>
  <div class="card">
    <h2>🧩 今日のメイン科目</h2>
    <div id="todayMain"></div>
  </div>
</div>

<!-- ========== WEEK ========== -->
<div class="view" id="view-week">
  <div class="card">
    <h2>今週やる科目</h2>
    <select id="subjSel"></select>
    <div class="wk-actions">
      <button class="wk-btn wk-primary" id="autoBtn">⚡️ 自動でわりふる</button>
      <button class="wk-btn wk-ghost" id="clearBtn">クリア</button>
    </div>
    <div id="selHint"></div>
    <div class="tray" id="tray"></div>
    <div id="weekNav" class="week-nav"></div>
    <div id="days"></div>
  </div>
</div>

<!-- ========== TASKS / EDITOR ========== -->
<div class="view" id="view-tasks">
  <div class="card">
    <h2>📊 medu4×QB 全科目の進捗
      <button class="wk-btn wk-ghost" id="resyncBtn" style="flex:0 0 auto;padding:5px 9px;font-size:10px;">🔄 カタログと同期</button>
    </h2>
    <div id="ownerPlan"></div>
  </div>
  <div class="card">
    <h2>タスク一覧・編集</h2>
    <select id="edSubjSel"></select>
    <div id="edList"></div>
    <div class="add-box">
      <div style="font-size:11px;font-weight:700;margin-bottom:7px;">➕ 抜けてたタスクを追加</div>
      <input class="txtin" id="addLabel" placeholder="タスク名（例：Ch10 ○○）">
      <div class="r">
        <select id="addType"><option value="qb">QB（問）</option><option value="video">映像（時間）</option></select>
        <input class="txtin" id="addTarget" type="number" placeholder="目標数" style="margin-bottom:0;">
      </div>
      <button class="wk-btn wk-primary" id="addBtn" style="width:100%;margin-top:8px;">追加する</button>
    </div>
  </div>
</div>

<!-- ========== PUBLIC ========== -->
<div class="view active" id="view-public">
  <div class="card"><h2>📅 今週の予定</h2><div id="pubWeek"></div></div>
  <div class="card"><h2>✅ 昨日やったこと</h2><div id="pubYest" style="font-size:12px;line-height:1.7;"></div></div>
  <div class="card"><h2>🔥 連続記録</h2>
    <div style="font-size:22px;font-weight:800;font-family:'SF Mono',Menlo,monospace;color:var(--gold);" id="pubStreak"></div>
  </div>
  <div class="card"><h2>🗺 全体の計画</h2><div id="pubPlan"></div></div>
  <div class="card" id="pubProgCard" style="display:none;"><h2>全体進捗</h2>
    <div style="font-size:22px;font-weight:800;font-family:'SF Mono',Menlo,monospace;color:var(--teal);" id="pubProg"></div>
  </div>
</div>

</main>

<div class="tabs">
  <button class="tb owner active" data-v="today"><span class="ic">🏠</span>今日</button>
  <button class="tb owner" data-v="week"><span class="ic">🧩</span>週間計画</button>
  <button class="tb owner" data-v="tasks"><span class="ic">📋</span>タスク</button>
  <button class="tb" data-v="public"><span class="ic">👀</span>公開</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== これを一番最初に登録：真っ白防止の砦 ===== */
window.onerror=(m,src,l,c,e)=>{
  const b=document.getElementById('errbar');
  if(!b)return;
  b.innerHTML=`<b>⚠️ 読み込みエラー</b>${(e&&e.message)||m}
    <button onclick="location.reload()">再読み込み</button>`;
  b.classList.add('show');
  console.error('onerror',m,e);
};
window.addEventListener('unhandledrejection',ev=>{
  const b=document.getElementById('errbar');
  if(!b)return;
  const msg=(ev.reason&&(ev.reason.message||ev.reason.error_description))||String(ev.reason);
  b.innerHTML=`<b>⚠️ 通信エラー</b>${msg}<button onclick="location.reload()">再読み込み</button>`;
  b.classList.add('show');
  console.error('unhandledrejection',ev.reason);
});
</script>

/* ===== consts ===== */
const DAYS=['月','火','水','木','金','土','日'];
const DEFAULT_CAP=[3,1.5,3,3,1.5,3,6];
const TARGET_DATE=new Date('2027-01-18T00:00:00');
const QB_PER_HOUR=20, CH_HOURS=1.5;

let state={pieces:{},caps:[...DEFAULT_CAP],logs:{},streak:0,lastLog:null};
let selChip=null, weekSubj='AUTO', edSubj=null, weekStart=null;

/* ===== date utils ===== */
/* 1日の区切りは深夜3時。3時になるまでは「前日」扱いにする */
const DAY_CUTOFF_HOURS=3;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const appNow=()=>{const d=new Date();d.setHours(d.getHours()-DAY_CUTOFF_HOURS);return d;};
const today=()=>iso(appNow());
const yest=()=>{const d=appNow();d.setDate(d.getDate()-1);return iso(d);};
const dow=()=>{const j=appNow().getDay();return j===0?6:j-1;};
const fmt=s=>{const[,m,d]=s.split('-');return`${+m}/${+d}`;};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);};
const dateDow=s=>{const j=new Date(s+'T00:00:00').getDay();return j===0?6:j-1;};
const mondayOf=s=>addDays(s,-dateDow(s));
const dname=s=>DAYS[dateDow(s)];

/* ===== build pieces from catalog ===== */
function sumNums(t){const m=t.match(/\((\d+)\)/g);return m?m.reduce((a,b)=>a+ +b.replace(/[()]/g,''),0):0;}
function buildPieces(){
  const P={};
  catalog.forEach((s,si)=>s.chapters.forEach((c,ci)=>{
    const noVid=c.ch.includes('仕上げ')||c.ch.includes('chapterなし');
    if(!noVid){const id=`${s.track}_${si}_${ci}_v`;
      P[id]={id,subject:s.name,track:s.track,type:'video',label:`${c.ch}`,unit:'h',
        targetValue:CH_HOURS,doneValue:0,hours:CH_HOURS,assignedDate:null};}
    const n=sumNums(c.qb);
    if(n>0){const id=`${s.track}_${si}_${ci}_q`;
      P[id]={id,subject:s.name,track:s.track,type:'qb',label:`${c.ch} のQB`,unit:'問',
        targetValue:n,doneValue:0,hours:n/QB_PER_HOUR,assignedDate:null};}
  }));
  return P;
}
function subjMeta(name){return catalog.find(s=>s.name===name)||{start:'',end:'',track:'main'};}
function subjProg(name){
  const ps=Object.values(state.pieces).filter(p=>p.subject===name);
  if(!ps.length)return 0;
  const t=ps.reduce((a,p)=>a+p.targetValue,0),d=ps.reduce((a,p)=>a+Math.min(p.doneValue,p.targetValue),0);
  return t>0?d/t:0;
}
function activeSubjects(){
  const t=today(),out=[];
  ['main','memo'].forEach(tr=>{
    const list=catalog.filter(s=>s.track===tr&&subjProg(s.name)<1).sort((a,b)=>a.start.localeCompare(b.start));
    if(!list.length)return;
    const cur=list.filter(s=>s.start<=t);
    if(cur.length){const inR=cur.filter(s=>t<=s.end);
      (inR.length?inR:[cur[cur.length-1]]).forEach(s=>out.push(s));}
    else out.push(list[0]);
  });
  return out.length?out:[catalog[catalog.length-1]];
}

/* ===== 暗記ノルマ 自動計算 ===== */
function memoQuota(){
  const memo=activeSubjects().filter(s=>s.track==='memo');
  const res=[];
  memo.forEach(s=>{
    const ps=Object.values(state.pieces).filter(p=>p.subject===s.name&&p.doneValue<p.targetValue)
      .sort((a,b)=>a.id.localeCompare(b.id));
    if(!ps.length)return;
    const t=today();
    const end=new Date(s.end), now=new Date(t);
    const daysLeft=Math.max(1,Math.round((end-now)/86400000)+1);
    const remQb=ps.filter(p=>p.type==='qb').reduce((a,p)=>a+(p.targetValue-p.doneValue),0);
    const remVid=ps.filter(p=>p.type==='video').reduce((a,p)=>a+(p.targetValue-p.doneValue),0);
    const qbPerDay=Math.ceil(remQb/daysLeft);
    const vidPerDay=remVid/daysLeft;
    // 今日取り組むべき先頭のピース
    const nextQb=ps.find(p=>p.type==='qb');
    const nextVid=ps.find(p=>p.type==='video');
    res.push({subject:s.name,daysLeft,qbPerDay,vidPerDay,nextQb,nextVid,endStr:fmt(s.end)});
  });
  return res;
}

/* ===== supabase io ===== */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label}が${ms/1000}秒たっても応答なし（通信が固まってる可能性）`)),ms))
  ]);
}

async function loadAll(){
  if(sbBroken || !sb){ state.pieces=buildPieces(); return; }
  try{
    const {data:st}=await withTimeout(sb.from('settings').select('*').eq('id',1).single(),8000,'設定の読み込み');
    if(st){state.caps=Array.isArray(st.capacities)?st.capacities:DEFAULT_CAP;
      state.streak=st.streak||0;state.lastLog=st.last_log_date||null;}
  }catch(e){ console.warn('settings load skipped',e); }
  const {data:rows,error}=await withTimeout(sb.from('pieces').select('*'),8000,'タスク一覧の読み込み');
  if(error){toast('接続エラー: '+error.message);state.pieces=buildPieces();return;}
  if(!rows||!rows.length){
    const fresh=buildPieces();
    const ins=Object.values(fresh).map(p=>({id:p.id,subject:p.subject,track:p.track,type:p.type,
      label:p.label,unit:p.unit,target_value:p.targetValue,done_value:0,hours:p.hours,assigned_day:null,assigned_date:null}));
    for(let i=0;i<ins.length;i+=200){await withTimeout(sb.from('pieces').insert(ins.slice(i,i+200)),8000,'初期データ投入');}
    state.pieces=fresh;
  }else{
    const P={};rows.forEach(r=>{P[r.id]={id:r.id,subject:r.subject,track:r.track,type:r.type,label:r.label,
      unit:r.unit,targetValue:+r.target_value,doneValue:+r.done_value,hours:+r.hours,
      assignedDate:r.assigned_date||null};});
    state.pieces=P;
  }
  let lg=[];
  try{ const r=await withTimeout(sb.from('daily_logs').select('*').in('log_date',[today(),yest()]),8000,'ログの読み込み'); lg=r.data||[]; }
  catch(e){ console.warn('logs load skipped',e); }
  state.logs={};
  (lg||[]).forEach(r=>{const d=r.log_date;
    if(!state.logs[d])state.logs[d]={total:0,entries:[]};
    state.logs[d].entries.push({pieceId:r.piece_id,value:+r.value,unit:r.unit});
    state.logs[d].total=Math.round((state.logs[d].total+ +r.value)*10)/10;});
}
async function saveSettings(){
  await sb.from('settings').update({capacities:state.caps,streak:state.streak,
    last_log_date:state.lastLog,updated_at:new Date().toISOString()}).eq('id',1);
}
async function savePiece(id){
  const p=state.pieces[id];
  await sb.from('pieces').update({done_value:p.doneValue,assigned_date:p.assignedDate,
    target_value:p.targetValue,label:p.label,hours:p.hours,unit:p.unit,updated_at:new Date().toISOString()}).eq('id',id);
}

/* ===== log ===== */
async function logIt(id,val){
  if(!gate())return;
  const p=state.pieces[id];if(!p||!val||val<=0)return;
  p.doneValue=Math.round((p.doneValue+val)*10)/10;
  const t=today();
  if(!state.logs[t])state.logs[t]={total:0,entries:[]};
  state.logs[t].entries.push({pieceId:id,value:val,unit:p.unit});
  state.logs[t].total=Math.round((state.logs[t].total+val)*10)/10;
  let up=false;
  if(state.lastLog!==t){state.streak=(state.lastLog===yest())?state.streak+1:1;state.lastLog=t;up=true;}
  await savePiece(id);
  await sb.from('daily_logs').insert({log_date:t,piece_id:id,value:val,unit:p.unit});
  await saveSettings();
  toast(up&&state.streak%7===0?`🎉 ${state.streak}日連続達成！`:`記録した：${p.label} +${val}${p.unit}`);
  safeRender();
}

/* ===== auto distribute ===== */
async function autoAssign(){
  if(!gate())return;
  const names=weekSubjNames();
  const un=Object.values(state.pieces)
    .filter(p=>p.assignedDate===null&&names.includes(p.subject)&&p.doneValue<p.targetValue)
    .sort((a,b)=>a.id.localeCompare(b.id));
  if(!un.length){toast('配置するタスクがないで');return;}
  const weekDates=[...Array(7)].map((_,i)=>addDays(weekStart,i));
  const load=weekDates.map(date=>
    Object.values(state.pieces).filter(p=>p.assignedDate===date).reduce((a,p)=>a+p.hours,0));
  const changed=[];
  un.forEach(p=>{
    let best=-1,bestRoom=-Infinity;
    for(let i=0;i<7;i++){
      const cap=state.caps[dateDow(weekDates[i])];
      const room=cap-load[i];
      if(room>=p.hours&&room>bestRoom){best=i;bestRoom=room;}
    }
    if(best<0){ // どこも空きがなければ一番余裕ある日へ
      let mi=0,mv=state.caps[dateDow(weekDates[0])]-load[0];
      for(let i=1;i<7;i++){const v=state.caps[dateDow(weekDates[i])]-load[i];if(v>mv){mv=v;mi=i;}}
      best=mi;
    }
    p.assignedDate=weekDates[best];load[best]+=p.hours;changed.push(p.id);
  });
  for(const id of changed)await savePiece(id);
  toast(`${changed.length}件を自動配置したで⚡️`);
  safeRender();
}

/* ===== カタログと同期し直す（過去の不具合で保存された数値を今のcatalogに合わせて上書き） ===== */
async function resyncCatalog(){
  if(!gate())return;
  const fresh=buildPieces();
  const updates=[];
  Object.values(fresh).forEach(p=>{
    const ex=state.pieces[p.id];
    if(ex){
      if(ex.targetValue!==p.targetValue||ex.hours!==p.hours||ex.label!==p.label||ex.unit!==p.unit){
        ex.targetValue=p.targetValue;ex.hours=p.hours;ex.label=p.label;ex.unit=p.unit;
        updates.push(ex.id);
      }
    }else{
      state.pieces[p.id]=p;
      updates.push(p.id);
    }
  });
  if(!updates.length){toast('ズレはなかったで、同期済み');return;}
  for(const id of updates)await savePiece(id);
  toast(`${updates.length}件をカタログに合わせて修正したで`);
  safeRender();
}

    target_value:target,done_value:0,hours,assigned_day:null,assigned_date:null};
  const {error}=await sb.from('pieces').insert(row);
  if(error){toast('追加エラー: '+error.message);return;}
  state.pieces[id]={id,subject:edSubj,track:meta.track,type,label,unit,
    targetValue:target,doneValue:0,hours,assignedDate:null};
  document.getElementById('addLabel').value='';document.getElementById('addTarget').value='';
  toast('タスクを追加したで');safeRender();
};

function renderPlanInto(elId, detailed){
  const pp=document.getElementById(elId);pp.innerHTML='';
  const t=today();
  [['main','MAIN科目'],['memo','暗記トラック']].forEach(([tr,lab])=>{
    const l=document.createElement('div');l.className='tlabel2';l.textContent=lab;pp.appendChild(l);
    catalog.filter(s=>s.track===tr).sort((a,b)=>a.start.localeCompare(b.start)).forEach(s=>{
      const pct=Math.round(subjProg(s.name)*100),now=s.start<=t&&t<=s.end;
      const ps=Object.values(state.pieces).filter(p=>p.subject===s.name);
      const qbDone=ps.filter(p=>p.type==='qb').reduce((a,p)=>a+Math.min(p.doneValue,p.targetValue),0);
      const qbTot=ps.filter(p=>p.type==='qb').reduce((a,p)=>a+p.targetValue,0);
      const r=document.createElement('div');r.className='prow'+(now?' now':'');
      r.innerHTML=`<span class="pdate">${fmt(s.start)}〜${fmt(s.end)}</span>
        <span class="pname">${s.name}${detailed?` <span style="color:var(--ink-soft);font-weight:400;">(QB ${qbDone}/${qbTot})</span>`:''}</span>
        <span class="pbar"><span class="pfill" style="width:${pct}%"></span></span>
        <span class="ppct">${pct}%</span>`;
      pp.appendChild(r);
    });
  });
}

/* ===== render: public ===== */
function renderPublic(){
  const pw=document.getElementById('pubWeek');pw.innerHTML='';
  const t=today();
  const memo=memoQuota();
  for(let i=0;i<7;i++){
    const date=addDays(t,i);
    const ps=Object.values(state.pieces).filter(p=>p.assignedDate===date);
    const bits=ps.map(p=>`${p.subject}｜${short(p.label,12)}`);
    if(i===0&&memo.length)memo.forEach(q=>bits.push(`${q.subject}（暗記ノルマ）`));
    const r=document.createElement('div');
    r.style.cssText='display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #eef2f5;font-size:11px;line-height:1.5;'+
      (i===0?'background:var(--teal-soft);border-radius:7px;padding-left:6px;':'');
    r.innerHTML=`<b style="width:44px;flex-shrink:0;">${dname(date)} ${fmt(date)}</b><span>${bits.length?bits.join('、'):'（休み・未定）'}</span>`;
    pw.appendChild(r);
  }

  const y=state.logs[yest()];
  const py=document.getElementById('pubYest');
  if(y&&y.entries.length){
    const byPiece={};
    y.entries.forEach(e=>{const p=state.pieces[e.pieceId];if(!p)return;
      const k=`${p.subject}｜${p.label}`;byPiece[k]=(byPiece[k]||0)+e.value;});
    py.innerHTML=Object.entries(byPiece).map(([k,v])=>{
      const unit=k.includes('QB')?'問':'h';return `・${k} <b>${Math.round(v*10)/10}${unit}</b>`;}).join('<br>');
  }else py.textContent='記録なし';

  document.getElementById('pubStreak').textContent='🔥 '+state.streak+'日';

  renderPlanInto('pubPlan', false);

  const all=Object.values(state.pieces);
  const tt=all.reduce((a,p)=>a+p.targetValue,0),dd=all.reduce((a,p)=>a+Math.min(p.doneValue,p.targetValue),0);
  const pct=tt>0?Math.round(dd/tt*100):0;
  const c=document.getElementById('pubProgCard');
  if(pct>=75){c.style.display='block';document.getElementById('pubProg').textContent=pct+'%';}
  else c.style.display='none';
}

function renderAll(){
  if(!weekStart){
    weekStart = (dateDow(today())===6) ? addDays(mondayOf(today()),7) : mondayOf(today());
  }
  const d=appNow();
  document.getElementById('dateHead').textContent=`${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`;
  document.getElementById('cdNum').textContent=Math.round((TARGET_DATE-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  renderToday();renderWeek();renderTasks();renderPublic();
}

/* ===== tabs / auth ===== */
function tab(v){
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  window.scrollTo(0,0);
}
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>tab(b.dataset.v));
document.getElementById('subjSel').onchange=e=>{weekSubj=e.target.value;selChip=null;renderWeek();};
document.getElementById('edSubjSel').onchange=e=>{edSubj=e.target.value;renderTasks();};
document.getElementById('autoBtn').onclick=autoAssign;
document.getElementById('clearBtn').onclick=async()=>{
  if(!gate())return;
  const weekDates=[...Array(7)].map((_,i)=>addDays(weekStart,i));
  const ids=Object.values(state.pieces).filter(p=>weekDates.includes(p.assignedDate)).map(p=>p.id);
  if(!ids.length){toast('この週には配置済みタスクがないで');return;}
  Object.values(state.pieces).forEach(p=>{if(weekDates.includes(p.assignedDate))p.assignedDate=null;});
  await sb.from('pieces').update({assigned_date:null}).in('id',ids);
  toast('この週の配置をクリアしたで');safeRender();
};
function authUI(){
  document.body.classList.toggle('is-owner',owner);
  const b=document.getElementById('authBtn');
  b.textContent=owner?'🔓 編集中':'🔑 ログイン';
  b.classList.toggle('on',owner);
}
document.getElementById('authBtn').onclick=async()=>{
  if(sbBroken||!sb){ toast('Supabaseに接続できてません。再読み込みしてみて'); return; }
  if(owner){
    if(!confirm('ログアウトする？（次回また入力が必要になります）'))return;
    await sb.auth.signOut();owner=false;authUI();tab('public');toast('ログアウトしたで');
  }else document.getElementById('lo').classList.add('show');
};
document.getElementById('loClose').onclick=()=>document.getElementById('lo').classList.remove('show');
document.getElementById('loSub').onclick=async()=>{
  if(sbBroken||!sb){ document.getElementById('loMsg').textContent='Supabaseに接続できてません'; return; }
  const msg=document.getElementById('loMsg');msg.textContent='確認中...';
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById('loEmail').value,
    password:document.getElementById('loPass').value});
  if(error){msg.textContent='失敗：'+error.message;return;}
  owner=true;authUI();tab('today');
  document.getElementById('lo').classList.remove('show');
  msg.textContent='';toast('ログインしたで、編集モードON');
  try{ await loadAll(); }catch(e){ showErr('データ再読み込み',e); }
  safeRender();
};

/* ===== error reporting ===== */
function showErr(where,e){
  const b=document.getElementById('errbar');
  const msg=(e&&(e.message||e.error_description||e.msg))||String(e);
  b.innerHTML=`<b>⚠️ ${where} でエラー</b>${msg}
    <button onclick="location.reload()">再読み込み</button>`;
  b.classList.add('show');
  console.error(where,e);
}
window.onerror=(m,src,l,c,e)=>{showErr('画面表示',e||m);};
window.addEventListener('unhandledrejection',ev=>{showErr('通信',ev.reason);});
function safeRender(){
  try{ renderAll(); }
  catch(e){ showErr('画面表示',e); }
}

/* ===== init ===== */
(async function(){
  if(sbBroken || !sb){
    state.pieces=buildPieces();
    safeRender();
    tab('public');
    return;
  }
  let rendered=false;
  const masterTimer=setTimeout(()=>{
    if(rendered)return;
    showErr('初期化', new Error('10秒たっても応答がありません。通信環境が悪いか、Supabase側で問題が起きています。'));
    if(!Object.keys(state.pieces).length) state.pieces=buildPieces();
    safeRender();
    tab('public');
    rendered=true;
  },10000);

  try{
    const {data}=await withTimeout(sb.auth.getSession(),8000,'ログイン状態の確認');
    owner=!!(data&&data.session);
  }catch(e){ showErr('ログイン確認',e); owner=false; }
  authUI();
  try{ sb.auth.onAuthStateChange((e,s)=>{owner=!!s;authUI();}); }catch(e){}

  try{
    await loadAll();
  }catch(e){
    showErr('データ読み込み',e);
    if(!Object.keys(state.pieces).length) state.pieces=buildPieces();
  }
  if(!rendered){
    clearTimeout(masterTimer);
    safeRender();
    tab(owner?'today':'public');
    rendered=true;
  }
})();
</script>
</body>
</html>
