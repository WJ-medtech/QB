<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神計画アプリ</title>
<style>
  :root{
    --ink:#16232e; --ink-soft:#4a5c6b; --bg:#f5f8fa; --card:#ffffff; --line:#dbe4ea;
    --teal:#0f8b8d; --teal-soft:#e3f3f2;
    --amber:#d98e3a; --amber-soft:#faf0e2;
    --done:#2ba58a; --done-soft:#e6f5ef;
    --purple:#6a5acd; --purple-soft:#ece9fb;
    --coral:#e0665a; --coral-soft:#fbe7e5;
    --gold:#dcb13f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:78px;
  }
  header{ background:var(--ink); color:#fff; padding:20px 16px 14px; }
  .eyebrow-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  header .eyebrow{ font-size:10.5px; letter-spacing:.1em; color:#8fb9ba; font-family:"SF Mono","Menlo",monospace; }
  .auth-btn{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:20px;
    padding:5px 10px; font-size:10.5px; font-weight:700;
  }
  .auth-btn.logged-in{ background:var(--done-soft); color:var(--done); border-color:var(--done); }

  .login-overlay{
    display:none; position:fixed; inset:0; background:rgba(22,35,46,.55); z-index:60;
    align-items:center; justify-content:center; padding:20px;
  }
  .login-overlay.show{ display:flex; }
  .login-card{ background:#fff; border-radius:16px; padding:18px; width:100%; max-width:320px; }
  .login-head{ display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:800; margin-bottom:12px; }
  .login-close{ background:none; border:none; font-size:18px; color:var(--ink-soft); }
  .login-card input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:13px; margin-bottom:8px;
  }
  .login-submit{
    width:100%; background:var(--ink); color:#fff; border:none; border-radius:9px; padding:10px; font-size:13px; font-weight:700;
  }
  .login-msg{ font-size:11px; color:var(--coral); margin-top:8px; min-height:14px; }

  .lock-note{ font-size:10.5px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; flex-shrink:0; }
  header h1{ margin:0; font-size:17px; }
  .countdown{ display:flex; align-items:baseline; gap:6px; margin-top:10px; }
  .countdown .num{ font-size:30px; font-weight:800; font-family:"SF Mono","Menlo",monospace; line-height:1; }
  .countdown .lbl{ font-size:11px; color:#a9bcc6; }

  main{ max-width:520px; margin:0 auto; padding:16px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2{ font-size:13px; margin:0 0 10px; color:var(--ink-soft); }

  .stat-row{ display:flex; gap:8px; margin-bottom:12px; }
  .stat{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .stat .k{ font-size:10px; color:var(--ink-soft); margin-bottom:2px; }
  .stat .v{ font-size:18px; font-weight:800; font-family:"SF Mono","Menlo",monospace; }
  .stat.streak .v{ color:var(--gold); }
  .stat.yesterday .v{ color:var(--teal); }

  .piece-row{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid #eef2f5; }
  .piece-row:last-child{ border-bottom:none; }
  .piece-tag{ font-size:9px; font-weight:800; padding:2px 6px; border-radius:6px; flex-shrink:0; }
  .tag-main{ background:var(--teal-soft); color:var(--teal); }
  .tag-memo{ background:var(--purple-soft); color:var(--purple); }
  .piece-body{ flex:1; min-width:0; }
  .piece-label{ font-size:12px; font-weight:700; line-height:1.4; }
  .piece-bar-wrap{ margin-top:5px; }
  .piece-bar-top{ display:flex; justify-content:space-between; font-size:10px; color:var(--ink-soft); font-family:"SF Mono","Menlo",monospace; margin-bottom:2px; }
  .piece-bar{ height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .piece-bar-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--done)); }
  .log-form{ display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .log-form input{
    width:48px; padding:6px 4px; border:1px solid var(--line); border-radius:7px; font-size:12px; text-align:center;
    font-family:"SF Mono","Menlo",monospace;
  }
  .log-form button{
    background:var(--done); color:#fff; border:none; border-radius:7px; padding:6px 9px; font-size:11px; font-weight:700;
  }
  .empty-note{ font-size:11.5px; color:var(--ink-soft); padding:8px 2px; }

  .tabs{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    display:flex; z-index:10;
  }
  .tab-btn{
    flex:1; padding:10px 4px 12px; text-align:center; font-size:10.5px; color:var(--ink-soft); background:none; border:none;
  }
  .tab-btn .ic{ display:block; font-size:17px; margin-bottom:2px; }
  .tab-btn.active{ color:var(--teal); font-weight:700; }

  .view{ display:none; }
  .view.active{ display:block; }

  /* WEEK VIEW */
  details.cap-details{ margin-bottom:12px; }
  details.cap-details summary{
    list-style:none; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; font-size:12px; font-weight:700; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center;
  }
  details.cap-details summary::-webkit-details-marker{ display:none; }
  .week-settings{ display:flex; flex-direction:column; gap:6px; background:var(--card); border:1px solid var(--line); border-top:none;
    border-radius:0 0 12px 12px; padding:10px 14px 12px; }
  .day-cap-row{ display:flex; align-items:center; gap:6px; font-size:11px; }
  .day-cap-row .dname{ width:26px; font-weight:700; flex-shrink:0; }
  .day-cap-row input[type=number]{ width:46px; padding:4px; border:1px solid var(--line); border-radius:6px; text-align:center; }
  .day-cap-row .unit{ color:var(--ink-soft); font-size:10px; }
  .memo-toggle{ display:flex; align-items:center; gap:3px; font-size:10px; color:var(--ink-soft); margin-left:auto; }

  .phase-select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-size:12px;
    background:#fff; color:var(--ink); margin-bottom:10px; font-family:inherit;
  }
  .phase-hint{ font-size:10.5px; color:var(--ink-soft); margin:-4px 0 10px; }

  .pace-banner{
    border-radius:12px; padding:11px 14px; margin-bottom:12px; font-size:12px; font-weight:700; line-height:1.5;
  }
  .pace-ahead{ background:var(--done-soft); color:var(--done); }
  .pace-ontrack{ background:var(--teal-soft); color:var(--teal); }
  .pace-behind{ background:var(--amber-soft); color:var(--amber); }
  .pace-banner .sub{ display:block; font-weight:400; font-size:10.5px; margin-top:3px; opacity:.85; }

  .lookahead{
    display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); margin:-4px 0 8px;
  }

  .plan-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #eef2f5; }
  .plan-row:last-child{ border-bottom:none; }
  .plan-row.now{ background:var(--teal-soft); border-radius:8px; padding-left:6px; padding-right:6px; }
  .plan-date{ font-size:9.5px; color:var(--ink-soft); font-family:"SF Mono","Menlo",monospace; width:66px; flex-shrink:0; }
  .plan-name{ font-size:11.5px; font-weight:700; flex:1; min-width:0; }
  .plan-bar{ width:64px; height:6px; background:var(--line); border-radius:4px; overflow:hidden; flex-shrink:0; }
  .plan-bar-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--done)); }
  .plan-pct{ font-size:9.5px; font-family:"SF Mono","Menlo",monospace; color:var(--ink-soft); width:30px; text-align:right; flex-shrink:0; }
  .plan-track-label{ font-size:10.5px; font-weight:700; color:var(--ink-soft); margin:10px 0 4px; }

  .backlog-tray{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .chip{
    padding:10px 14px; border-radius:10px; font-size:12px; font-weight:700; color:#fff; cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.1); width:100%; text-align:left; line-height:1.4;
  }
  .chip.selected{ outline:2px solid var(--ink); outline-offset:1px; }
  .chip-teal{ background:var(--teal); } .chip-purple{ background:var(--purple); }

  .days-strip{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .day-col{ flex:0 0 120px; }
  .day-head{ display:flex; flex-direction:column; margin-bottom:5px; }
  .day-head .dn{ font-size:12px; font-weight:800; }
  .day-head .load{ font-size:9.5px; font-family:"SF Mono","Menlo",monospace; color:var(--ink-soft); }
  .day-head .load.over{ color:var(--coral); font-weight:700; }
  .day-drop{
    background:#fff; border:1.5px dashed var(--line); border-radius:10px; padding:6px; min-height:280px;
    display:flex; flex-direction:column; gap:6px;
  }
  .day-drop.over{ border-color:var(--coral); background:var(--coral-soft); }
  .day-empty2{ font-size:10px; color:#c3cdd4; text-align:center; padding-top:10px; }
  .assigned-chip{
    padding:5px 7px; border-radius:8px; font-size:9.5px; font-weight:700; color:#fff; cursor:pointer; line-height:1.3;
  }

  .clear-week-btn{
    display:block; width:100%; margin-top:10px; background:none; border:1px solid var(--line); color:var(--ink-soft);
    font-size:11px; padding:9px; border-radius:10px;
  }

  /* BACKLOG VIEW */
  .filter-row{ display:flex; gap:6px; margin-bottom:10px; }
  .filter-btn{ flex:1; padding:7px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:11px; color:var(--ink-soft); }
  .filter-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* PUBLIC VIEW */
  .public-lock{ text-align:center; padding:30px 16px; color:var(--ink-soft); font-size:12px; line-height:2; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; z-index:50; opacity:0; transition:opacity .3s, top .3s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; top:26px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow-row">
    <div class="eyebrow">KOKUSHI PLANNER · v3（Supabase版）</div>
    <button class="auth-btn" id="authBtn">🔑 ログイン</button>
  </div>
  <h1 id="dateHead"></h1>
  <div class="countdown"><span class="num" id="cdNum">--</span><span class="lbl">日 · 国試模試(1/18)まで</span></div>
</header>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-head">
      <span>ログイン</span>
      <button class="login-close" id="loginClose">×</button>
    </div>
    <input type="email" id="loginEmail" placeholder="メールアドレス" />
    <input type="password" id="loginPassword" placeholder="パスワード" />
    <button class="login-submit" id="loginSubmit">ログイン</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<main>

  <!-- TODAY -->
  <div class="view active" id="view-today">
    <div class="pace-banner" id="paceBanner"></div>
    <div class="stat-row">
      <div class="stat streak"><div class="k">連続日数</div><div class="v" id="streakVal">🔥0</div></div>
      <div class="stat yesterday"><div class="k">昨日の実績</div><div class="v" id="yestVal">0</div></div>
    </div>
    <div class="card">
      <h2>今日わりあてたタスク</h2>
      <div id="todayList"></div>
    </div>
  </div>

  <!-- WEEK -->
  <div class="view" id="view-week">
    <details class="cap-details">
      <summary>曜日ごとの使える時間（タップで開閉・週替わりで調整OK）</summary>
      <div class="week-settings" id="capSettings"></div>
    </details>

    <div class="card">
      <h2>今回配置する科目</h2>
      <select class="phase-select" id="phaseSelect"></select>
      <label class="lookahead"><input type="checkbox" id="lookaheadChk" /> 先取りモード（次の科目も一緒に表示）</label>
      <div class="phase-hint" id="phaseHint"></div>

      <div class="backlog-tray" id="unassignedTray"></div>

      <div class="days-strip" id="daysArea"></div>

      <button class="clear-week-btn" id="clearWeekBtn">今週の配置を全部クリア（次の週の計画へ）</button>
    </div>
  </div>

  <!-- BACKLOG -->
  <div class="view" id="view-backlog">
    <div class="filter-row">
      <button class="filter-btn active" data-f="all">全部</button>
      <button class="filter-btn" data-f="undone">未完了のみ</button>
      <button class="filter-btn" data-f="main">MAIN</button>
      <button class="filter-btn" data-f="memo">暗記</button>
    </div>
    <div class="card"><div id="backlogList"></div></div>
  </div>

  <!-- PUBLIC -->
  <div class="view" id="view-public">
    <div class="card">
      <h2>🔒 公開ビュー（プレビュー）</h2>
      <div class="public-lock">
        今はこの端末のブラウザ内だけの表示。<br>
        Supabaseに繋いだら、ここが本当に「誰でもログイン無しで見れるURL」になります。<br>
        見えるのは「週間予定」「昨日やったこと」「連続記録」だけで、進捗％は75%を超えたら表示。
      </div>
    </div>
    <div class="card">
      <h2>今週の予定（公開される内容）</h2>
      <div id="publicWeek"></div>
    </div>
    <div class="card">
      <h2>昨日やったこと</h2>
      <div id="publicYesterday" style="font-size:12.5px;"></div>
    </div>
    <div class="card">
      <h2>連続記録</h2>
      <div style="font-size:20px;font-weight:800;font-family:'SF Mono','Menlo',monospace;color:var(--gold);" id="publicStreak"></div>
    </div>
    <div class="card">
      <h2>全体の計画図</h2>
      <div id="publicPlan"></div>
    </div>
    <div class="card" id="publicProgressCard" style="display:none;">
      <h2>全体進捗</h2>
      <div style="font-size:20px;font-weight:800;font-family:'SF Mono','Menlo',monospace;color:var(--teal);" id="publicProgress"></div>
    </div>
  </div>

</main>

<div class="tabs">
  <button class="tab-btn active" data-v="today"><span class="ic">🏠</span>今日</button>
  <button class="tab-btn" data-v="week"><span class="ic">🧩</span>週間パズル</button>
  <button class="tab-btn" data-v="backlog"><span class="ic">📋</span>全タスク</button>
  <button class="tab-btn" data-v="public"><span class="ic">👀</span>公開ビュー</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   0) Supabase接続
   ========================================================= */
const SUPABASE_URL = 'https://zowzowjfzwzxomxkwtxc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpvd3pvd2pmend6eG9teGt3dHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjg4MjAsImV4cCI6MjEwMjkwNDgyMH0.cRTTymBqU6ikOVwMU_5yi1CsbTGQKt6UDBJYXay5c9Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isLoggedIn = false;

async function checkSession(){
  const { data } = await sb.auth.getSession();
  isLoggedIn = !!data.session;
  updateAuthUI();
}
function updateAuthUI(){
  const btn = document.getElementById('authBtn');
  if(isLoggedIn){
    btn.textContent = '🔓 編集中（タップでログアウト）';
    btn.classList.add('logged-in');
  } else {
    btn.textContent = '🔑 ログイン';
    btn.classList.remove('logged-in');
  }
}
document.getElementById('authBtn').addEventListener('click', async () => {
  if(isLoggedIn){
    await sb.auth.signOut();
    isLoggedIn = false;
    updateAuthUI();
    showToast('ログアウトしたで');
  } else {
    document.getElementById('loginOverlay').classList.add('show');
  }
});
document.getElementById('loginClose').addEventListener('click', () => {
  document.getElementById('loginOverlay').classList.remove('show');
});
document.getElementById('loginSubmit').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  msg.textContent = '確認中...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    msg.textContent = 'ログイン失敗：' + error.message;
    return;
  }
  isLoggedIn = true;
  updateAuthUI();
  document.getElementById('loginOverlay').classList.remove('show');
  msg.textContent = '';
  showToast('ログインしたで、編集モードON');
  renderAll();
});
function requireLogin(){
  if(!isLoggedIn){
    showToast('編集にはログインが必要です🔒');
    document.getElementById('loginOverlay').classList.add('show');
    return false;
  }
  return true;
}
/* =========================================================
   1) データカタログ（medu4 Chapter × QB 中項目）
   track: main / memo, start/end: そのフェーズの目安期間
   ※数値は全て検算済み（26分野の合計が元の6979問と一致）
   ========================================================= */
const catalog = [
  { name:"内分泌・代謝", track:"main", start:"2026-08-24", end:"2026-08-30", chapters:[
    {ch:"Ch1 内分泌代謝の総論", qb:"（基礎・ホルモン概説）"},

    {ch:"仕上げ", qb:"総合問題(20)・120回問題(13)"}

    {ch:"Ch2 腎不全", qb:"腎不全(30)"},
    {ch:"Ch3 腎血管", qb:"腎血管性疾患(11)"},
    {ch:"Ch4 糸球体", qb:"糸球体疾患(40)・全身疾患と腎障害(24)"},
    {ch:"Ch5 尿細管・間質", qb:"尿細管機能障害・間質性疾患(12)・遺伝性腎疾患(4)"},
    {ch:"仕上げ", qb:"総合問題(2)・120回問題(10)"}
  ]},
  { name:"消化管", track:"main", start:"2026-10-12", end:"2026-10-18", chapters:[
    {ch:"Ch1 総論", qb:"消化管総論(24)"},
    {ch:"Ch2 食道", qb:"食道疾患(37)"},
    {ch:"Ch3 胃", qb:"胃・十二指腸疾患(55)"},

    {ch:"Ch5 腸の閉塞と虚血・腫瘍", qb:"腸疾患(45)の残り"},
    {ch:"Ch6 肛門・横隔膜・腹膜・腹壁", qb:"肛門疾患(10)・腹壁腹膜疾患(17)"},
    {ch:"仕上げ", qb:"総合問題(26)・120回問題(22)"}
  ]},
  { name:"肝・胆・膵", track:"main", start:"2026-10-12", end:"2026-10-18", chapters:[
    {ch:"Ch1 総論", qb:"肝臓総論(15)・胆道総論(11)・膵臓総論(4)"},
    {ch:"Ch2 肝の炎症", qb:"肝臓疾患(40)の一部"},

function extractSum(text){
  const m = text.match(/\d+/g);
  if(!m) return 0;
  return m.reduce((a,b)=>a+parseInt(b,10),0);
}
function buildPiecesFromCatalog(){
  const pieces = {};
  catalog.forEach((subj, sIdx) => {
    subj.chapters.forEach((c, cIdx) => {
      const noVideo = c.ch.includes('仕上げ') || c.ch.includes('chapterなし');
      if(!noVideo){
        const vid = `${subj.track}_${sIdx}_${cIdx}_v`;
        pieces[vid] = { id:vid, subject:subj.name, track:subj.track, type:'video',
          label:`${subj.name}｜${c.ch}`, unit:'h', targetValue:1.5, doneValue:0, hours:1.5, assignedDay:null };
      }
      const sum = extractSum(c.qb);
      if(sum>0){
        const qid = `${subj.track}_${sIdx}_${cIdx}_q`;
        pieces[qid] = { id:qid, subject:subj.name, track:subj.track, type:'qb',
          label:`${subj.name}｜${c.ch}のQB`, unit:'問', targetValue:sum, doneValue:0, hours:sum/20, assignedDay:null };
      }
    });
  });
  return pieces;
}

/* =========================================================
   3) 状態管理（今はブラウザのローカルストレージに保存）
   ========================================================= */
const DAY_NAMES = ['月','火','水','木','金','土','日'];
const DEFAULT_CAP = [3,1,3,3,1,2,6];
const DEFAULT_MEMO_ONLY = [false,true,false,false,true,false,false];
const CBT_DATE = new Date('2027-01-18T00:00:00');

let state = {
  pieces: {},
  weekSettings: { capacities:[...DEFAULT_CAP], memoOnly:[...DEFAULT_MEMO_ONLY] },
  logs: {},
  streak: 0,
  lastLogDate: null
};
let selectedChipId = null;
let backlogFilter = 'all';
let currentPhaseKey = null; // "trackIdx_subjectName" のような選択キー

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yesterdayStr(){
  const d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayDow(){ // 0=Mon..6=Sun
  const jsDay = new Date().getDay();
  return jsDay === 0 ? 6 : jsDay - 1;
}

function subjectProgress(name){
  const ps = Object.values(state.pieces).filter(p=>p.subject===name);
  if(ps.length===0) return 0;
  const t = ps.reduce((a,p)=>a+p.targetValue,0);
  const d = ps.reduce((a,p)=>a+Math.min(p.doneValue,p.targetValue),0);
  return t>0 ? d/t : 0;
}

function getActiveSubjects(){
  // 予定表に沿って「今やるべき科目」を返す。
  // すでに終わってる科目は自動でスキップして、次の科目を繰り上げる（＝先に進めた分だけ前倒し）
  const t = todayStr();
  const result = [];
  ['main','memo'].forEach(track => {
    const list = catalog.filter(s=>s.track===track).sort((a,b)=>a.start.localeCompare(b.start));
    // 未完了(進捗100%未満)の中で、開始日が今日以前 or 一番早いもの
    const remaining = list.filter(s => subjectProgress(s.name) < 1);
    if(remaining.length === 0) return;
    const current = remaining.filter(s => s.start <= t);
    if(current.length > 0){
      // 期間中のものが複数ある場合（同週2科目など）は全部返す
      const inRange = current.filter(s => t <= s.end);
      if(inRange.length > 0){ inRange.forEach(s=>result.push(s)); }
      else { result.push(current[current.length-1]); } // 期限すぎて残ってるもの
    } else {
      result.push(remaining[0]); // まだ先の予定なら直近の次のもの
    }
  });
  if(result.length===0) return [catalog[catalog.length-1]];
  return result;
}

function getNextSubjects(activeList){
  // 先取りモード用：activeの次に来る科目をtrackごとに1つずつ
  const t = todayStr();
  const next = [];
  ['main','memo'].forEach(track=>{
    const list = catalog.filter(s=>s.track===track && subjectProgress(s.name)<1)
                        .sort((a,b)=>a.start.localeCompare(b.start));
    const activeNames = activeList.map(s=>s.name);
    const notActive = list.filter(s=>!activeNames.includes(s.name));
    if(notActive.length) next.push(notActive[0]);
  });
  return next;
}

function computePace(){
  // 予定では今日までにどれだけ終わってるはずか vs 実際
  const t = todayStr();
  let expectedHours = 0, actualHours = 0, totalHours = 0;
  catalog.forEach(subj=>{
    const ps = Object.values(state.pieces).filter(p=>p.subject===subj.name);
    const subjHours = ps.reduce((a,p)=>a+p.hours,0);
    totalHours += subjHours;
    const doneH = ps.reduce((a,p)=>a + p.hours * Math.min(1, p.targetValue>0 ? p.doneValue/p.targetValue : 0), 0);
    actualHours += doneH;
    if(subj.end < t){
      expectedHours += subjHours;
    } else if(subj.start <= t && t <= subj.end){
      const s = new Date(subj.start), e = new Date(subj.end), now = new Date(t);
      const span = (e - s)/86400000 + 1;
      const elapsed = (now - s)/86400000 + 1;
      expectedHours += subjHours * Math.max(0, Math.min(1, elapsed/span));
    }
  });
  const dailyAvg = state.weekSettings.capacities.reduce((a,b)=>a+b,0) / 7;
  const diffH = actualHours - expectedHours;
  const diffDays = dailyAvg>0 ? diffH/dailyAvg : 0;
  return { expectedHours, actualHours, totalHours, diffH, diffDays };
}

async function loadState(){
  // 設定を取得
  const { data: settingsRows, error: setErr } = await sb.from('settings').select('*').eq('id', 1).single();
  if(!setErr && settingsRows){
    state.weekSettings.capacities = settingsRows.capacities || DEFAULT_CAP;
    state.weekSettings.memoOnly = settingsRows.memo_only || DEFAULT_MEMO_ONLY;
    state.streak = settingsRows.streak || 0;
    state.lastLogDate = settingsRows.last_log_date || null;
  }

  // タスク（pieces）を取得。無ければ初回シード
  const { data: pieceRows, error: pieceErr } = await sb.from('pieces').select('*');
  if(pieceErr){
    showToast('Supabase接続エラー：' + pieceErr.message);
    state.pieces = buildPiecesFromCatalog();
    return;
  }
  if(!pieceRows || pieceRows.length === 0){
    // 初回のみ：カタログから全ピースを作ってDBに流し込む
    const fresh = buildPiecesFromCatalog();
    const rows = Object.values(fresh).map(p => ({
      id:p.id, subject:p.subject, track:p.track, type:p.type, label:p.label,
      unit:p.unit, target_value:p.targetValue, done_value:0, hours:p.hours, assigned_day:null
    }));
    const { error: insErr } = await sb.from('pieces').insert(rows);
    if(insErr){ showToast('初期データ投入エラー：' + insErr.message); }
    state.pieces = fresh;
  } else {
    const pieces = {};
    pieceRows.forEach(r => {
      pieces[r.id] = {
        id:r.id, subject:r.subject, track:r.track, type:r.type, label:r.label,
        unit:r.unit, targetValue:Number(r.target_value), doneValue:Number(r.done_value),
        hours:Number(r.hours), assignedDay: r.assigned_day===null?null:Number(r.assigned_day)
      };
    });
    state.pieces = pieces;
  }

  // 昨日・今日のログ集計（daily_logsから）
  const { data: logRows } = await sb.from('daily_logs').select('*')
    .in('log_date', [todayStr(), yesterdayStr()]);
  state.logs = {};
  (logRows||[]).forEach(r => {
    const d = r.log_date;
    if(!state.logs[d]) state.logs[d] = { total:0, unitMix:'', entries:[] };
    state.logs[d].entries.push({ pieceId:r.piece_id, value:Number(r.value), unit:r.unit });
    state.logs[d].total = Math.round((state.logs[d].total + Number(r.value)) * 10) / 10;
    state.logs[d].unitMix = r.unit;
  });
}

async function saveSettings(){
  await sb.from('settings').update({
    capacities: state.weekSettings.capacities,
    memo_only: state.weekSettings.memoOnly,
    streak: state.streak,
    last_log_date: state.lastLogDate,
    updated_at: new Date().toISOString()
  }).eq('id', 1);
}

async function savePiece(pieceId){
  const p = state.pieces[pieceId];
  await sb.from('pieces').update({
    done_value: p.doneValue,
    assigned_day: p.assignedDay,
    updated_at: new Date().toISOString()
  }).eq('id', pieceId);
}

   4) レンダリング
   ========================================================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function renderHeader(){
  const d = new Date();
  document.getElementById('dateHead').textContent =
    `${d.getMonth()+1}月${d.getDate()}日（${['日','月','火','水','木','金','土'][d.getDay()]}）`;
  const diffMs = CBT_DATE - new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const days = Math.round(diffMs/86400000);
  document.getElementById('cdNum').textContent = days;
}

function renderToday(){
  renderPaceBanner();
  document.getElementById('streakVal').textContent = '🔥' + state.streak;
  const y = state.logs[yesterdayStr()];
  document.getElementById('yestVal').textContent = y ? y.total + (y.unitMix || '') : '0';

  const dow = todayDow();
  const list = document.getElementById('todayList');
  list.innerHTML = '';
  const todays = Object.values(state.pieces).filter(p => p.assignedDay === dow);
  if(todays.length === 0){
    list.innerHTML = '<div class="empty-note">今日にはまだタスクが配置されてません。「週間パズル」タブで割り振ろう。</div>';
    return;
  }
  todays.forEach(p => list.appendChild(renderPieceRow(p)));
}

function renderPaceBanner(){
  const el = document.getElementById('paceBanner');
  const pace = computePace();
  const d = pace.diffDays;
  let cls, msg, sub;
  if(d >= 0.5){
    cls = 'pace-ahead';
    msg = `⚡️ 予定より約${d.toFixed(1)}日ぶん先行中`;
    sub = '先取りモードで次の科目を前倒しできるで';
  } else if(d <= -0.5){
    cls = 'pace-behind';
    msg = `📌 予定より約${Math.abs(d).toFixed(1)}日ぶん遅れ`;
    sub = '焦らんでOK。今日できる分から拾っていこ';
  } else {
    cls = 'pace-ontrack';
    msg = '✅ ほぼ予定どおり';
    sub = 'このペースを維持しよう';
  }
  el.className = 'pace-banner ' + cls;
  el.innerHTML = `${msg}<span class="sub">${sub}（消化 ${pace.actualHours.toFixed(0)}h / 予定 ${pace.expectedHours.toFixed(0)}h・全体 ${pace.totalHours.toFixed(0)}h）</span>`;
}

function renderPieceRow(p){
  const row = document.createElement('div');
  row.className = 'piece-row';
  const pct = Math.min(100, Math.round((p.doneValue / p.targetValue) * 100));
  row.innerHTML = `
    <span class="piece-tag ${p.track==='main'?'tag-main':'tag-memo'}">${p.track==='main'?'MAIN':'暗記'}</span>
    <div class="piece-body">
      <div class="piece-label">${p.label}</div>
      <div class="piece-bar-wrap">
        <div class="piece-bar-top"><span>${p.doneValue}/${p.targetValue}${p.unit}</span><span>${pct}%</span></div>
        <div class="piece-bar"><div class="piece-bar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="log-form">
      <input type="number" min="0" placeholder="${p.unit}" />
      <button>記録</button>
    </div>
  `;
  const input = row.querySelector('input');
  const btn = row.querySelector('button');
  btn.addEventListener('click', () => {
    const v = parseFloat(input.value);
    if(!v || v<=0) return;
    logPiece(p.id, v, p.unit);
    input.value = '';
  });
  return row;
}

async function logPiece(pieceId, value, unit){
  if(!requireLogin()) return;
  const p = state.pieces[pieceId];
  if(!p) return;
  p.doneValue = Math.round((p.doneValue + value) * 10) / 10;

  const t = todayStr();
  if(!state.logs[t]) state.logs[t] = { total:0, unitMix:'', entries:[] };
  state.logs[t].entries.push({ pieceId, value, unit });
  state.logs[t].total = Math.round((state.logs[t].total + value) * 10) / 10;
  state.logs[t].unitMix = unit;

  let streakUp = false;
  if(state.lastLogDate !== t){
    if(state.lastLogDate === yesterdayStr()){
      state.streak += 1;
    } else {
      state.streak = 1;
    }
    state.lastLogDate = t;
    streakUp = true;
  }

  await savePiece(pieceId);
  await sb.from('daily_logs').insert({ log_date:t, piece_id:pieceId, value, unit });
  await saveSettings();

  if(streakUp && state.streak > 0 && state.streak % 7 === 0){
    showToast(`🎉 ${state.streak}日連続達成！`);
  } else {
    showToast('記録したで👍');
  }

  renderAll();
}

function renderWeekSettings(){
  const wrap = document.getElementById('capSettings');
  wrap.innerHTML = '';
  DAY_NAMES.forEach((dn, i) => {
    const row = document.createElement('div');
    row.className = 'day-cap-row';
    row.innerHTML = `
      <span class="dname">${dn}</span>
      <input type="number" step="0.5" min="0" value="${state.weekSettings.capacities[i]}" />
      <span class="unit">h</span>
      <label class="memo-toggle"><input type="checkbox" ${state.weekSettings.memoOnly[i]?'checked':''}/> 暗記のみ</label>
    `;
    const numInput = row.querySelector('input[type=number]');
    const chk = row.querySelector('input[type=checkbox]');
    numInput.addEventListener('change', () => {
      if(!requireLogin()){ numInput.value = state.weekSettings.capacities[i]; return; }
      state.weekSettings.capacities[i] = parseFloat(numInput.value) || 0;
      saveSettings(); renderWeekArea();
    });
    chk.addEventListener('change', () => {
      if(!requireLogin()){ chk.checked = state.weekSettings.memoOnly[i]; return; }
      state.weekSettings.memoOnly[i] = chk.checked;
      saveSettings(); renderWeekArea();
    });
    wrap.appendChild(row);
  });
}

function renderPhaseSelect(){
  const sel = document.getElementById('phaseSelect');
  const activeNow = getActiveSubjects();
  if(currentPhaseKey === null){
    currentPhaseKey = 'AUTO';
  }
  sel.innerHTML = '';
  const autoOpt = document.createElement('option');
  autoOpt.value = 'AUTO';
  autoOpt.textContent = '🗓 今の予定（自動）：' + activeNow.map(s=>s.name).join('・');
  sel.appendChild(autoOpt);

  const mainGroup = document.createElement('optgroup');
  mainGroup.label = 'MAIN科目';
  catalog.filter(s=>s.track==='main').forEach(s=>{
    const o = document.createElement('option');
    o.value = s.name; o.textContent = `${s.name}（${fmtDate(s.start)}〜${fmtDate(s.end)}）`;
    mainGroup.appendChild(o);
  });
  sel.appendChild(mainGroup);

  const memoGroup = document.createElement('optgroup');
  memoGroup.label = '暗記科目';
  catalog.filter(s=>s.track==='memo').forEach(s=>{
    const o = document.createElement('option');
    o.value = s.name; o.textContent = `${s.name}（${fmtDate(s.start)}〜${fmtDate(s.end)}）`;
    memoGroup.appendChild(o);
  });
  sel.appendChild(memoGroup);

  sel.value = currentPhaseKey;
  const lookahead = document.getElementById('lookaheadChk').checked;
  document.getElementById('phaseHint').textContent =
    currentPhaseKey === 'AUTO'
      ? (lookahead
          ? '自動表示＋次の科目も先取り表示中。終わった科目は自動でスキップされます。'
          : 'スケジュール通り、今やるべき科目を自動表示。終わった科目は自動でスキップされます。')
      : '手動で選択中。「今の予定（自動）」に戻すといつでも自動選択に戻せます。';
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${parseInt(m)}/${parseInt(d)}`;
}

function getTraySubjectNames(){
  if(currentPhaseKey === 'AUTO'){
    const active = getActiveSubjects();
    const names = active.map(s=>s.name);
    if(document.getElementById('lookaheadChk').checked){
      getNextSubjects(active).forEach(s=>names.push(s.name));
    }
    return names;
  }
  return [currentPhaseKey];
}

function renderWeekArea(){
  const traySubjects = getTraySubjectNames();

  const tray = document.getElementById('unassignedTray');
  tray.innerHTML = '';
  const unassigned = Object.values(state.pieces).filter(p => p.assignedDay === null && traySubjects.includes(p.subject));
  if(unassigned.length === 0){
    tray.innerHTML = '<div class="empty-note">この科目の未配置タスクはなし（配置済み or 完了済み）</div>';
  }
  unassigned.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'chip ' + (p.track==='main'?'chip-teal':'chip-purple') + (selectedChipId===p.id?' selected':'');
    chip.textContent = `${p.label} (${p.hours.toFixed(1)}h)`;
    chip.addEventListener('click', () => {
      selectedChipId = (selectedChipId === p.id) ? null : p.id;
      renderWeekArea();
    });
    tray.appendChild(chip);
  });

  const daysArea = document.getElementById('daysArea');
  daysArea.innerHTML = '';
  DAY_NAMES.forEach((dn, i) => {
    const col = document.createElement('div');
    col.className = 'day-col';
    const dayPieces = Object.values(state.pieces).filter(p => p.assignedDay === i);
    const loadH = dayPieces.reduce((a,p)=>a+p.hours,0);
    const cap = state.weekSettings.capacities[i];
    const over = cap>0 ? (loadH/cap) >= 1.0 : loadH>0;

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `<span class="dn">${dn}</span><span class="load ${over?'over':''}">${loadH.toFixed(1)}/${cap}h${over?' ⚠️':''}</span>`;
    col.appendChild(head);

    const drop = document.createElement('div');
    drop.className = 'day-drop' + (over?' over':'');
    drop.addEventListener('click', () => {
      if(selectedChipId){
        if(!requireLogin()) return;
        const memoOnly = state.weekSettings.memoOnly[i];
        const piece = state.pieces[selectedChipId];
        if(memoOnly && piece.track !== 'memo'){
          showToast('この曜日は暗記トラックのみ配置できます');
          return;
        }
        piece.assignedDay = i;
        const pid = selectedChipId;
        selectedChipId = null;
        savePiece(pid);
        renderWeekArea();
        renderToday();
      }
    });
    if(dayPieces.length===0){
      drop.innerHTML = '<span class="day-empty2">タップで配置</span>';
    } else {
      dayPieces.forEach(p => {
        const ac = document.createElement('div');
        ac.className = 'assigned-chip ' + (p.track==='main'?'chip-teal':'chip-purple');
        ac.textContent = shortLabel(p.label);
        ac.title = 'タップで未配置に戻す';
        ac.addEventListener('click', (e) => {
          e.stopPropagation();
          if(!requireLogin()) return;
          p.assignedDay = null;
          savePiece(p.id); renderWeekArea(); renderToday();
        });
        drop.appendChild(ac);
      });
    }
    col.appendChild(drop);
    daysArea.appendChild(col);
  });
}

function shortLabel(label){
  return label.length > 14 ? label.slice(0,13)+'…' : label;
}

function renderBacklog(){
  const list = document.getElementById('backlogList');
  list.innerHTML = '';
  let items = Object.values(state.pieces);
  if(backlogFilter==='undone') items = items.filter(p=>p.doneValue < p.targetValue);
  if(backlogFilter==='main') items = items.filter(p=>p.track==='main');
  if(backlogFilter==='memo') items = items.filter(p=>p.track==='memo');
  if(items.length===0){ list.innerHTML = '<div class="empty-note">該当タスクなし</div>'; return; }
  items.forEach(p => list.appendChild(renderPieceRow(p)));
}

function renderPublicPlan(){
  const wrap = document.getElementById('publicPlan');
  wrap.innerHTML = '';
  const t = todayStr();
  [['main','MAIN科目（週ごとに1科目）'],['memo','暗記トラック（毎日並走）']].forEach(([track,label])=>{
    const lab = document.createElement('div');
    lab.className = 'plan-track-label';
    lab.textContent = label;
    wrap.appendChild(lab);
    catalog.filter(s=>s.track===track)
      .sort((a,b)=>a.start.localeCompare(b.start))
      .forEach(s=>{
        const pct = Math.round(subjectProgress(s.name)*100);
        const isNow = s.start <= t && t <= s.end;
        const row = document.createElement('div');
        row.className = 'plan-row' + (isNow?' now':'');
        row.innerHTML = `
          <span class="plan-date">${fmtDate(s.start)}〜${fmtDate(s.end)}</span>
          <span class="plan-name">${s.name}</span>
          <span class="plan-bar"><span class="plan-bar-fill" style="width:${pct}%"></span></span>
          <span class="plan-pct">${pct}%</span>
        `;
        wrap.appendChild(row);
      });
  });
}

function renderPublic(){
  renderPublicPlan();
  const pw = document.getElementById('publicWeek');
  pw.innerHTML = '';
  DAY_NAMES.forEach((dn,i)=>{
    const dayPieces = Object.values(state.pieces).filter(p=>p.assignedDay===i);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;padding:6px 0;border-bottom:1px solid #eef2f5;font-size:11.5px;';
    row.innerHTML = `<b style="width:20px;">${dn}</b><span>${dayPieces.length? dayPieces.map(p=>shortLabel(p.label)).join('、') : '（未定）'}</span>`;
    pw.appendChild(row);
  });

  const y = state.logs[yesterdayStr()];
  document.getElementById('publicYesterday').textContent = y
    ? `${y.entries.length}タスクに取り組んで、合計${y.total}${y.unitMix}進めました`
    : '記録なし';

  document.getElementById('publicStreak').textContent = '🔥 ' + state.streak + '日';

  const allPieces = Object.values(state.pieces);
  const totalTarget = allPieces.reduce((a,p)=>a+p.targetValue,0);
  const totalDone = allPieces.reduce((a,p)=>a+Math.min(p.doneValue,p.targetValue),0);
  const pct = totalTarget>0 ? Math.round((totalDone/totalTarget)*100) : 0;
  const card = document.getElementById('publicProgressCard');
  if(pct >= 75){
    card.style.display='block';
    document.getElementById('publicProgress').textContent = pct + '%';
  } else {
    card.style.display='none';
  }
}

function renderAll(){
  renderHeader();
  renderToday();
  renderWeekSettings();
  renderPhaseSelect();
  renderWeekArea();
  renderBacklog();
  renderPublic();
}

document.getElementById('clearWeekBtn').addEventListener('click', async () => {
  if(!requireLogin()) return;
  const assignedIds = Object.values(state.pieces).filter(p=>p.assignedDay!==null).map(p=>p.id);
  Object.values(state.pieces).forEach(p => p.assignedDay = null);
  if(assignedIds.length){
    await sb.from('pieces').update({ assigned_day:null, updated_at:new Date().toISOString() }).in('id', assignedIds);
  }
  renderWeekArea(); renderToday(); renderPublic();
  showToast('今週の配置をクリアしたで');
});
document.getElementById('lookaheadChk').addEventListener('change', () => {
  selectedChipId = null;
  renderPhaseSelect();
  renderWeekArea();
});
document.getElementById('phaseSelect').addEventListener('change', (e) => {
  currentPhaseKey = e.target.value;
  selectedChipId = null;
  renderPhaseSelect();
  renderWeekArea();
});

/* =========================================================
   6) 起動
   ========================================================= */
(async function init(){
  await checkSession();
  sb.auth.onAuthStateChange((event, session) => {
    isLoggedIn = !!session;
    updateAuthUI();
  });
  await loadState();
  renderAll();
})();
</script>
